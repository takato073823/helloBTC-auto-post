name: 既存文字化けアイキャッチ一括修復（手動）

on:
  schedule:
    # Google RPDは太平洋時間0時にリセット。夏時間中は日本時間16:10。
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: 修復開始日（YYYY-MM-DD）
        required: true
        default: "2026-08-01"
        type: string
      audit_pass_slugs:
        description: 合格・承認済みのため変更しないスラッグ（カンマ区切り）
        required: false
        default: "clarity-act-senate-delay,xrpl-confidential-transfers-rwa,mica-crypto-regulation-impact,sec-regulation-crypto-proposal,trump-media-bitcoin-losses,bitmine-eth-buyback-shift"
        type: string
      include_repaired:
        description: 抽象化された修復画像を写真風でやり直す
        required: true
        default: false
        type: boolean
      max_items:
        description: 1回に修復する最大件数（0は無制限）
        required: true
        default: "0"
        type: string
      shard_index:
        description: シャード番号（0始まり）
        required: true
        default: "0"
        type: string
      shard_count:
        description: シャード総数
        required: true
        default: "1"
        type: string

jobs:
  repair-garbled-featured-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 一括修復ルールテスト
        working-directory: scripts
        run: python -m unittest test_repair_garbled_featured_images.py test_news_post_rules.py

      - name: 不合格画像を再生成して差し替え
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPAIR_SINCE: ${{ inputs.since || '2026-08-01' }}
          AUDIT_PASS_SLUGS: ${{ inputs.audit_pass_slugs || 'clarity-act-senate-delay,xrpl-confidential-transfers-rwa,mica-crypto-regulation-impact,sec-regulation-crypto-proposal,trump-media-bitcoin-losses,bitmine-eth-buyback-shift' }}
          REPAIR_INCLUDE_REPAIRED: ${{ inputs.include_repaired || 'false' }}
          REPAIR_SHARD_INDEX: ${{ inputs.shard_index || '0' }}
          REPAIR_SHARD_COUNT: ${{ inputs.shard_count || '1' }}
          REPAIR_MAX_ITEMS: ${{ inputs.max_items || '10' }}
          REPAIR_ONLY_SLUGS_FILE: featured_image_pre_repair_map.tsv
        working-directory: scripts
        run: python repair_garbled_featured_images.py
