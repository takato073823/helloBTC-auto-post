name: Google News 信頼性修正

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 修正内容をテスト
        working-directory: scripts
        run: python -m unittest test_google_news_visibility.py test_news_post_rules.py test_wp_poster_seo.py

      - name: 編集方針ページと投稿者情報を反映
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        working-directory: scripts
        run: python repair_google_news_visibility.py
