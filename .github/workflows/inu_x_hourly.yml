name: INU 画像付き毎時投稿

on:
  schedule:
    # GitHub Actionsの定刻実行は遅延・欠落することがあるため、毎時2回だけに
    # 依存しない。03分を主探索、以後10分ごとを同一時間枠の復旧確認として実行する。
    # スクリプト側がJST時間単位で予約・公開済みを判定するため、1時間に複数投稿はしない。
    - cron: "3 * * * *"
    - cron: "13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "実際にXへ投稿する"
        required: true
        default: false
        type: boolean
      recovery:
        description: "監視による定刻実行の復旧"
        required: false
        default: false
        type: boolean

concurrency:
  # 速報探索や個別投稿が長引いても、毎時の定期枠を待たせない。
  # 重複防止は prepare が永続状態の予約で行う。
  group: inu-x-hourly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.INU_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 外部サービスの一時停止で、この枠を無期限に占有しない。
    timeout-minutes: 20
    env:
      INU_SCHEDULE_RUN_KIND: ${{ github.event.schedule == '3 * * * *' && 'primary' || github.event_name == 'schedule' && 'watchdog' || inputs.recovery == true && 'watchdog' || 'retry' }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 一次資料の画像取得環境をセットアップ
        # Ubuntu runner にある依存ライブラリを使い、apt の更新待ちを避ける。
        # Chromium の取得が止まっても、次の復旧枠を妨げないよう上限を設ける。
        run: timeout 360 python -m playwright install chromium

      - name: 手動ドライラン候補を準備
        id: dry_prepare
        if: github.event_name == 'workflow_dispatch' && inputs.live != true && inputs.live != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          INU_RESEARCH_MODEL: gpt-5.6-terra
          XAI_RESEARCH_MODEL: grok-4.3
          INU_GROK_EDITORIAL_ENABLED: true
          INU_IMAGE_PROVIDER: openai
          INU_IMAGE_FALLBACK_PROVIDER: none
        working-directory: scripts
        run: python inu_auto_hourly.py --prepare --dry-run

      - name: 最新の一次情報から投稿候補を準備
        id: prepare
        if: github.event_name == 'schedule' || inputs.live == true || inputs.live == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          INU_RESEARCH_MODEL: gpt-5.6-terra
          XAI_RESEARCH_MODEL: grok-4.3
          INU_GROK_EDITORIAL_ENABLED: true
          INU_IMAGE_PROVIDER: openai
          INU_IMAGE_FALLBACK_PROVIDER: none
        working-directory: scripts
        run: python inu_auto_hourly.py --prepare

      - name: ドライラン画像を保存
        if: steps.dry_prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inu-hourly-dry-run
          path: scripts/artifacts/inu-auto/
          retention-days: 3

      - name: スケジュール実行状態を先に保存
        if: github.event_name == 'schedule' || inputs.recovery == true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: record INU scheduled check [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: 手動実行の投稿予約を先に保存
        if: github.event_name == 'workflow_dispatch' && steps.prepare.outputs.ready == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: reserve INU hourly post [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: 画像付き投稿を1件公開
        id: publish
        if: steps.prepare.outputs.ready == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        working-directory: scripts
        run: python inu_auto_hourly.py --publish

      - name: 毎時投稿履歴を保存
        if: steps.publish.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: record INU hourly post [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
