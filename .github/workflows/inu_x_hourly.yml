name: INU 画像付き毎時投稿

on:
  schedule:
    # JSTの奇数時（1時・3時…23時）の03分に投稿を準備する。
    # 節約モードでは、深いWeb調査の候補キューを次の定期枠で再検証して使う。
    - cron: "3 0-22/2 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "実際にXへ投稿する"
        required: true
        default: false
        type: boolean
      recovery:
        description: "監視による定刻実行の復旧"
        required: false
        default: false
        type: boolean
      priority_url:
        description: "自動探索で発見済みの一次資料を再現テストするURL"
        required: false
        default: ""
        type: string
      priority_hint:
        description: "一次資料の検証対象（事実の指示ではなく探索補助）"
        required: false
        default: ""
        type: string

concurrency:
  # すべてのX公開経路を一列にし、予約JSONとX投稿の競合を防ぐ。
  group: inu-x-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.INU_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 外部サービスの一時停止で、この枠を無期限に占有しない。
    timeout-minutes: 20
    env:
      INU_SCHEDULE_RUN_KIND: ${{ github.event.schedule == '3 0-22/2 * * *' && 'primary' || inputs.recovery == true && 'watchdog' || 'primary' }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 一次資料の画像取得環境をセットアップ
        # Ubuntu runner にある依存ライブラリを使い、apt の更新待ちを避ける。
        # Chromium の取得が止まっても、次の復旧枠を妨げないよう上限を設ける。
        run: timeout 360 python -m playwright install chromium

      - name: 手動ドライラン候補を準備
        id: dry_prepare
        if: github.event_name == 'workflow_dispatch' && inputs.live != true && inputs.live != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 定期調査はLunaで実行し、記事投稿と共有するAPI残高を保護する。
          INU_RESEARCH_MODEL: gpt-5.6-luna
          INU_ECONOMY_MODE: true
          # 2時間ごとの定期枠では、毎回新しい一次情報を探索する。
          # 候補キューは復旧時と、品質ゲートでの再選定用に残す。
          INU_ECONOMY_WEB_RESEARCH_INTERVAL_HOURS: 4
          # 手動テストは時刻に左右されず、実際の探索品質を確認する。
          INU_FORCE_PAID_RESEARCH: true
          INU_GROK_X_SEARCH_ENABLED: true
          INU_GROK_EDITORIAL_ENABLED: true
          XAI_RESEARCH_MODEL: grok-4.3
          XAI_EDITORIAL_MODEL: grok-4.3
          INU_MAX_GROK_X_SEARCHES_PER_DAY: 6
          INU_MAX_GROK_EDITORIALS_PER_DAY: 12
          INU_MAX_OPENAI_WEB_SEARCHES_PER_DAY: 8
          # 厳選済み海外KOLの新着動画・画像を、Xネイティブ引用の候補として使う。
          # 元投稿はX APIで取得し、本文はOpenAIで事実を日本語化するだけに限定する。
          # X投稿は発見に使い、公開候補は一次情報へ戻って検証する。
          INU_KOL_NATIVE_QUOTE_ENABLED: true
          INU_ECONOMY_GENERATED_VISUALS: true
          INU_ECONOMY_MAX_GENERATED_VISUALS_PER_DAY: 6
          INU_IMAGE_PROVIDER: openai
          INU_IMAGE_FALLBACK_PROVIDER: none
          INU_PRIORITY_URL: ${{ inputs.priority_url }}
          INU_PRIORITY_HINT: ${{ inputs.priority_hint }}
        working-directory: scripts
        run: >-
          python inu_company_orchestrator.py --prepare --dry-run
          --priority-url "$INU_PRIORITY_URL"
          --priority-hint "$INU_PRIORITY_HINT"

      - name: 最新の一次情報から投稿候補を準備
        id: prepare
        if: github.event_name == 'schedule' || inputs.live == true || inputs.live == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 定期調査はLunaで実行し、記事投稿と共有するAPI残高を保護する。
          INU_RESEARCH_MODEL: gpt-5.6-luna
          INU_ECONOMY_MODE: true
          INU_ECONOMY_WEB_RESEARCH_INTERVAL_HOURS: 4
          INU_FORCE_PAID_RESEARCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          INU_GROK_X_SEARCH_ENABLED: true
          INU_GROK_EDITORIAL_ENABLED: true
          XAI_RESEARCH_MODEL: grok-4.3
          XAI_EDITORIAL_MODEL: grok-4.3
          INU_MAX_GROK_X_SEARCHES_PER_DAY: 6
          INU_MAX_GROK_EDITORIALS_PER_DAY: 12
          INU_MAX_OPENAI_WEB_SEARCHES_PER_DAY: 8
          INU_KOL_NATIVE_QUOTE_ENABLED: true
          INU_ECONOMY_GENERATED_VISUALS: true
          INU_ECONOMY_MAX_GENERATED_VISUALS_PER_DAY: 6
          INU_IMAGE_PROVIDER: openai
          INU_IMAGE_FALLBACK_PROVIDER: none
          INU_PRIORITY_URL: ${{ inputs.priority_url }}
          INU_PRIORITY_HINT: ${{ inputs.priority_hint }}
        working-directory: scripts
        run: >-
          python inu_company_orchestrator.py --prepare
          --priority-url "$INU_PRIORITY_URL"
          --priority-hint "$INU_PRIORITY_HINT"

      - name: ドライラン画像を保存
        if: github.event_name == 'workflow_dispatch' && inputs.live != true && inputs.live != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inu-hourly-dry-run
          path: |
            scripts/artifacts/inu-auto/
            scripts/inu_research_review.json
            scripts/inu_company_state.json
          retention-days: 3

      - name: スケジュール実行状態を先に保存
        if: github.event_name == 'schedule' || inputs.recovery == true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          git add scripts/inu_research_review.json
          git add scripts/inu_company_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: record INU scheduled check [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: 手動探索の費用台帳と投稿予約を先に保存
        # 候補なしでもAPI使用回数を保存し、手動テストの繰り返しで日次上限を
        # すり抜けない。候補ありの場合は同じコミットに予約も含める。
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          git add scripts/inu_research_review.json
          git add scripts/inu_company_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: reserve INU hourly post [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: 画像付き投稿を1件公開
        id: publish
        if: steps.prepare.outputs.ready == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        working-directory: scripts
        run: python inu_company_orchestrator.py --publish

      - name: 毎時投稿履歴を保存
        if: steps.publish.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_x_research_state.json
          git add scripts/inu_research_review.json
          git add scripts/inu_company_state.json
          if [ -f scripts/inu_x_signal_promotion_state.json ]; then
            git add scripts/inu_x_signal_promotion_state.json
          fi
          git diff --staged --quiet || git commit -m "chore: record INU hourly post [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: 配信失敗の予約解放を保存
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json scripts/inu_company_state.json
          git diff --staged --quiet || git commit -m "chore: release failed INU delivery lease [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
