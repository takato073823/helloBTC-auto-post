name: INU X投稿プレビュー

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "投稿の冒頭"
        required: true
        type: string
      fact:
        description: "事実・要点（1段落）"
        required: true
        type: string
      opinion:
        description: "INUの見解（「僕は」で始める）"
        required: true
        type: string
      source:
        description: "出典名と日付"
        required: true
        type: string
      image_headline:
        description: "画像内の短い見出し"
        required: true
        type: string
      topic_type:
        description: "投稿の系統"
        required: true
        default: "breaking_news"
        type: choice
        options:
          - breaking_news
          - security_incident
          - risk_alert
          - market_microstructure
          - etf_flow
          - institutional_flow
          - onchain
          - whale_treasury
          - earnings
          - supply_event
          - adoption_kpi
          - policy_household
          - macro_event
          - macro_geopolitics
          - developing_story
          - timeline_explainer
          - public_figure_statement
          - ai_comparison
          - market_meme
          - campaign
      needs_timeline:
        description: "複数の出来事を時系列図にする"
        required: true
        default: false
        type: boolean
      risk_theme:
        description: "重大リスク画像の種類（risk_alertのみ）"
        required: false
        type: choice
        options:
          - ""
          - exchange_shutdown
          - withdrawal_halt
          - hack
          - custody_risk
      source_url:
        description: "公式スクリーンショット時の一次資料URL"
        required: false
        type: string
      source_name:
        description: "公式スクリーンショット時の発信元名"
        required: false
        type: string
      published_at:
        description: "公式スクリーンショット時の公開日（YYYY-MM-DD）"
        required: false
        type: string
      source_selector:
        description: "重要部分を指定するCSS selector（bodyなどページ全体は禁止）"
        required: false
        type: string
concurrency:
  group: inu-x-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: INUルールを検証
        working-directory: scripts
        run: python -m unittest test_inu_content_system.py test_x_poster_rules.py

      - name: 画像経路を決定
        id: route
        env:
          TOPIC_TYPE: ${{ inputs.topic_type }}
          NEEDS_TIMELINE: ${{ inputs.needs_timeline }}
        working-directory: scripts
        shell: bash
        run: |
          route=$(python -c 'import os; from inu_visual import select_visual_route; print(select_visual_route(os.environ["TOPIC_TYPE"], needs_timeline=os.environ["NEEDS_TIMELINE"] == "true").route)')
          echo "visual_route=$route" >> "$GITHUB_OUTPUT"

      - name: 公式ページ撮影用ブラウザを準備
        if: startsWith(steps.route.outputs.visual_route, 'official_')
        run: python -m playwright install --with-deps chromium

      - name: ドライランで画像と本文を生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HOOK: ${{ inputs.hook }}
          FACT: ${{ inputs.fact }}
          OPINION: ${{ inputs.opinion }}
          SOURCE_LABEL: ${{ inputs.source }}
          IMAGE_HEADLINE: ${{ inputs.image_headline }}
          TOPIC_TYPE: ${{ inputs.topic_type }}
          NEEDS_TIMELINE: ${{ inputs.needs_timeline }}
          RISK_THEME: ${{ inputs.risk_theme }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_NAME: ${{ inputs.source_name }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          SOURCE_SELECTOR: ${{ inputs.source_selector }}
        working-directory: scripts
        shell: bash
        run: |
          args=(
            --hook "$HOOK"
            --fact "$FACT"
            --opinion "$OPINION"
            --source "$SOURCE_LABEL"
            --image-headline "$IMAGE_HEADLINE"
            --topic-type "$TOPIC_TYPE"
            --source-url "$SOURCE_URL"
            --source-name "$SOURCE_NAME"
            --published-at "$PUBLISHED_AT"
            --source-selector "$SOURCE_SELECTOR"
          )
          if [[ -n "$RISK_THEME" ]]; then args+=(--risk-theme "$RISK_THEME"); fi
          if [[ "$NEEDS_TIMELINE" == "true" ]]; then args+=(--needs-timeline); fi
          python inu_preview.py "${args[@]}"

      - name: プレビューを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inu-x-preview
          path: scripts/artifacts/inu-preview/
          if-no-files-found: warn
