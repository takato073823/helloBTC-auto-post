name: INU X投稿プレビュー

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "投稿の冒頭"
        required: true
        type: string
      fact:
        description: "事実・要点（1段落）"
        required: true
        type: string
      opinion:
        description: "INUの見解（「僕は」で始める）"
        required: true
        type: string
      source:
        description: "出典名と日付"
        required: true
        type: string
      image_headline:
        description: "画像内の短い見出し"
        required: true
        type: string
      visual_type:
        description: "画像の種類"
        required: true
        default: "gpt_explainer"
        type: choice
        options:
          - official_text_crop
          - official_data_crop
          - gpt_explainer
          - gpt_timeline
          - gpt_creative
      source_url:
        description: "公式スクリーンショット時の一次資料URL"
        required: false
        type: string
      source_name:
        description: "公式スクリーンショット時の発信元名"
        required: false
        type: string
      published_at:
        description: "公式スクリーンショット時の公開日（YYYY-MM-DD）"
        required: false
        type: string
      source_selector:
        description: "重要部分を指定するCSS selector（bodyなどページ全体は禁止）"
        required: false
        type: string
concurrency:
  group: inu-x-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: INUルールを検証
        working-directory: scripts
        run: python -m unittest test_inu_content_system.py test_x_poster_rules.py

      - name: 公式ページ撮影用ブラウザを準備
        if: startsWith(inputs.visual_type, 'official_')
        run: python -m playwright install --with-deps chromium

      - name: ドライランで画像と本文を生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HOOK: ${{ inputs.hook }}
          FACT: ${{ inputs.fact }}
          OPINION: ${{ inputs.opinion }}
          SOURCE_LABEL: ${{ inputs.source }}
          IMAGE_HEADLINE: ${{ inputs.image_headline }}
          VISUAL_TYPE: ${{ inputs.visual_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_NAME: ${{ inputs.source_name }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          SOURCE_SELECTOR: ${{ inputs.source_selector }}
        working-directory: scripts
        run: >-
          python inu_preview.py
          --hook "$HOOK"
          --fact "$FACT"
          --opinion "$OPINION"
          --source "$SOURCE_LABEL"
          --image-headline "$IMAGE_HEADLINE"
          --visual-type "$VISUAL_TYPE"
          --source-url "$SOURCE_URL"
          --source-name "$SOURCE_NAME"
          --published-at "$PUBLISHED_AT"
          --source-selector "$SOURCE_SELECTOR"

      - name: プレビューを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inu-x-preview
          path: scripts/artifacts/inu-preview/
          if-no-files-found: warn
