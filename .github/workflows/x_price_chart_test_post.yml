name: INU BTC価格チャート投稿テスト

on:
  workflow_dispatch:
    inputs:
      live:
        description: "実際にXへ投稿する"
        required: true
        default: false
        type: boolean
      post_key:
        description: "二重投稿防止キー"
        required: true
        default: "btc_price_chart_test_v1"
        type: string

concurrency:
  group: inu-x-price-chart-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  price-chart-test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 価格チャート投稿を検証
        working-directory: scripts
        run: python -m unittest test_x_price_chart_post.py test_x_poster_rules.py

      - name: BTC価格チャートを生成
        if: inputs.live != true
        env:
          POST_KEY: ${{ inputs.post_key }}
        working-directory: scripts
        run: python x_price_chart_post.py --key "$POST_KEY" --output ../artifacts/inu-btc-price-chart.png

      - name: BTC価格チャートをXへ投稿
        if: inputs.live == true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          POST_KEY: ${{ inputs.post_key }}
        working-directory: scripts
        run: python x_price_chart_post.py --live --key "$POST_KEY" --output ../artifacts/inu-btc-price-chart.png

      - name: 生成画像を保存
        if: always() && hashFiles('artifacts/inu-btc-price-chart.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: inu-btc-price-chart
          path: artifacts/inu-btc-price-chart.png
          if-no-files-found: error

      - name: 投稿履歴を保存
        if: inputs.live == true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/x_price_chart_state.json
          git diff --staged --quiet || git commit -m "chore: record INU BTC price chart test [skip ci]"
          git pull --rebase
          git push
