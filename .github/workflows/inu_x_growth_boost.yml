name: INU フォロワー成長ブースト

on:
  schedule:
    # 速報探索と初動反応を両立しつつ、既存の毎時投稿の17分・37分を避ける。
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

concurrency:
  # 成長施策の状態だけを直列化する。毎時・速報の重い投稿キューと分け、
  # 10分ごとの探索・反応が待ち行列で失われないようにする。
  group: inu-x-growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  boost:
    if: github.event_name == 'workflow_dispatch' || vars.INU_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install --timeout 120 -r requirements.txt

      - name: 成長施策の安全ルールを検証
        working-directory: scripts
        run: python -m unittest test_inu_follow_growth.py test_inu_growth_boost.py test_inu_growth_watchlist.py test_x_poster_rules.py test_x_poster_social_actions.py

      - name: A〜Dを最大1件だけ実行
        working-directory: scripts
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_RESEARCH_MODEL: grok-4.3
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python inu_growth_boost.py

      - name: 成長施策の状態を保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # ウォッチリスト由来の発見は専用シャードに保存する。公式X探索の状態と
          # 同じJSONを並行更新しないため、候補をGit競合で失わない。
          git add scripts/inu_growth_boost_state.json scripts/inu_growth_watchlist_state.json scripts/inu_x_watchlist_signals_state.json scripts/inu_follow_growth_state.json
          git diff --staged --quiet || git commit -m "chore: record INU growth boost [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
