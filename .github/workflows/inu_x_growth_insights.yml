name: INU 日次成長レビュー

on:
  schedule:
    # JST 21:59。日中の公開実績を翌日の候補選定へ返す。
    - cron: "59 12 * * *"
  workflow_dispatch:

concurrency:
  # 投稿履歴の読取と保存を、公開キューと直列化する。
  group: inu-x-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (vars.INU_AUTOMATION_ENABLED == 'true' && vars.INU_GROWTH_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install --timeout 120 -r requirements.txt

      - name: 成長レビューのルールを検証
        working-directory: scripts
        run: python -m unittest test_inu_growth_insights.py test_inu_auto_hourly.py

      - name: 自アカウントの公開実績を振り返る
        working-directory: scripts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python inu_growth_insights.py

      - name: 成長レビューを保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_growth_insights.json
          git diff --staged --quiet || git commit -m "chore: review INU post growth [skip ci]"
          git pull --rebase
          git push
