name: INU 個別ニュース投稿
on:
  workflow_dispatch:
    inputs:
      post_id:
        required: true
        type: choice
        options:
          - approved_btc_fx_20261118
permissions:
  contents: read
  actions: read
concurrency:
  group: inu-x-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/review/inu-btc-fx-20261118' && inputs.post_id == 'approved_btc_fx_20261118' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify only dispatch and approved asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          first=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/inu_x_manual_news.yml/runs?branch=review%2Finu-btc-fx-20261118&event=workflow_dispatch&per_page=100" --jq 'if .total_count == 1 then .workflow_runs[0].id else 0 end')
          test "$first" = "$GITHUB_RUN_ID"
          echo '910bae1838b0f15785b1582ac639b3263673e0746672b6e7cde236e7b4cd9cf3  approved-btc-fx.png' | sha256sum -c -
      - run: python -m pip install 'tweepy==4.16.0'
      - name: Publish approved post once
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os
          import tweepy
          from pathlib import Path
          keys = [os.environ[k] for k in ("X_API_KEY", "X_API_KEY_SECRET", "X_ACCESS_TOKEN", "X_ACCESS_TOKEN_SECRET")]
          client = tweepy.Client(consumer_key=keys[0], consumer_secret=keys[1], access_token=keys[2], access_token_secret=keys[3])
          assert client.get_me(user_auth=True).data.username.lower() == 'hellobtc_jp'
          text = Path('approved-btc-fx.txt').read_text().rstrip('\n')
          media = tweepy.API(tweepy.OAuth1UserHandler(*keys), retry_count=0).media_upload(filename='approved-btc-fx.png')
          result = client.create_tweet(text=text, media_ids=[media.media_id_string], user_auth=True)
          tweet_id = str(result.data['id'])
          assert tweet_id.isdecimal()
          print('PUBLIC_URL=https://x.com/hellobtc_jp/status/' + tweet_id)
          PY
