name: INU 重要ニュース速報

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: inu-x-publish
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.INU_BREAKING_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 軽量監視に必要なパッケージをインストール
        run: pip install --timeout 120 requests beautifulsoup4 feedparser lxml Pillow tweepy

      - name: 重要ニュースを軽量監視
        id: probe
        working-directory: scripts
        run: python inu_breaking_news_probe.py

      - name: 投稿生成パッケージを追加
        if: steps.probe.outputs.ready == 'true'
        run: pip install --timeout 120 -r requirements.txt

      - name: 根拠画像の取得環境をセットアップ
        if: steps.probe.outputs.ready == 'true'
        run: python -m playwright install --with-deps chromium

      - name: 速報ルールを検証
        if: steps.probe.outputs.ready == 'true'
        working-directory: scripts
        run: python -m unittest test_inu_breaking_news_probe.py test_inu_auto_hourly.py test_inu_live_post.py test_x_poster_rules.py

      - name: 検知した速報を準備
        id: prepare
        if: steps.probe.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INU_COPY_MODEL: gpt-5.6-luna
          INU_EVENT_KEY: ${{ steps.probe.outputs.event_key }}
          INU_PRIORITY_URL: ${{ steps.probe.outputs.source_url }}
          INU_PRIORITY_HINT: ${{ steps.probe.outputs.headline }}
        working-directory: scripts
        run: >-
          python inu_auto_hourly.py --prepare --slot "$INU_EVENT_KEY"
          --priority-url "$INU_PRIORITY_URL" --priority-hint "$INU_PRIORITY_HINT"

      - name: 速報予約を先に保存
        if: steps.prepare.outputs.ready == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json
          git diff --staged --quiet || git commit -m "chore: reserve INU breaking news [skip ci]"
          git pull --rebase
          git push

      - name: 画像付き速報を公開
        id: publish
        if: steps.prepare.outputs.ready == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        working-directory: scripts
        run: python inu_auto_hourly.py --publish

      - name: 速報履歴を保存
        if: steps.publish.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_hourly_state.json
          git diff --staged --quiet || git commit -m "chore: record INU breaking news [skip ci]"
          git pull --rebase
          git push

      - name: 定時投稿の欠落を確認
        id: hourly_guard
        if: github.event_name == 'schedule'
        run: python scripts/inu_hourly_guard.py

      - name: 欠落した定時投稿を復旧起動
        if: github.event_name == 'schedule' && steps.hourly_guard.outputs.needs_recovery == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run inu_x_hourly.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f live=true
          -f recovery=true
