name: INU ブースト対象リスト管理

on:
  schedule:
    # UTC。毎時投稿・速報・ブースト実行と重ならない6時間ごとの時刻。
    - cron: "9 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  # ブーストが同じ状態ファイルを更新するため、投稿・ブーストと同じキューで直列化する。
  group: inu-x-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (vars.INU_AUTOMATION_ENABLED == 'true' && vars.INU_WATCHLIST_ENABLED != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install --timeout 120 -r requirements.txt

      - name: ウォッチリストの安全ルールを検証
        working-directory: scripts
        run: python -m unittest test_inu_growth_watchlist.py

      - name: ブースト対象を発見・評価・同期
        working-directory: scripts
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_RESEARCH_MODEL: grok-4.3
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python inu_growth_watchlist.py --allow-create

      - name: ウォッチリスト状態を保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/inu_growth_watchlist_state.json
          git diff --staged --quiet || git commit -m "chore: refresh INU boost watchlist [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 3))
          done
          exit 1
