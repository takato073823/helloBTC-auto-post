name: helloBTC 自動記事投稿

on:
  schedule:
    # 量より独自価値を優先し、米国時間の主要ニュースを確認できるJST 07:00に1本だけ審査する。
    - cron: "0 22 * * *"  # JST 07:00
  workflow_dispatch:  # 手動実行ボタン

jobs:
  post-article:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # posted_urls.json をコミットするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install --timeout 120 -r requirements.txt

      - name: 投稿とSEOのルールを検証
        working-directory: scripts
        run: python -m unittest test_news_post_rules.py test_wp_poster_seo.py

      - name: 記事を自動投稿
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5.6-luna
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        working-directory: scripts
        run: python main.py

      - name: 投稿済み URL リストをコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/posted_urls.json
          git diff --staged --quiet || git commit -m "chore: update posted URLs [skip ci]"
          git push
